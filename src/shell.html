<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v={{ver}}">
</head>
<body data-page="{{page}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <div id="load-error" class="wrap load-error" role="alert" hidden></div>
{{body}}
    <div class="wrap page-next-wrap"><div id="page-next" class="col-main"></div></div>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner" id="footer"></div>
  </footer>

  <div id="live" class="visually-hidden" aria-live="polite"></div>
  <script type="module" src="js/pages/{{page}}.js?v={{ver}}"></script>
</body>
</html>
